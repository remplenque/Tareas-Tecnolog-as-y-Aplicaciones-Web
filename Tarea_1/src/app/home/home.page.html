<app-encabezado titulo="Saludador" color="primary" subtitulo="Por Vicente Rodríguez." [mostrarBotonAcerca]="!!saludo" ></app-encabezado>


<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      label="Tu nombre"
      labelPlacement="floating"
      placeholder="Escribe tu nombre"
      [(ngModel)]="nombre"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Tu ciudad"
      labelPlacement="floating"
      placeholder="Escribe tu ciudad"
      [(ngModel)]="ciudad"
    ></ion-input>
  </ion-item>


<ion-button expand="block" [disabled]="!nombre.trim() || !ciudad.trim()" (click)="saludarYSalir()">Saludar</ion-button>

  @if (saludo) {
    <h1 class="ion-text-center">{{ saludo }}</h1>
      <!-- Paso 2: navega hacia adelante, a la ruta /acerca 
    <ion-button [routerLink]="['/acerca']">Acerca de</ion-button> -->
  }

<ion-button expand="block" [routerLink]="['/home/consejo']">
    Ver consejo (ruta hija)
  </ion-button>

  <router-outlet></router-outlet>

  <ion-button expand="block" fill="outline" [routerLink]="['/home/ayuda']">
    Ver ayuda (ruta hija 2)
  </ion-button>

  <router-outlet></router-outlet>

</ion-content>
